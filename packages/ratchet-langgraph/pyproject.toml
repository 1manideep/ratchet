[project]
name = "ratchet-langgraph"
version = "0.1.0"
description = "LangGraph middleware adapter for the Ratchet authorization broker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ratchet-core",
    "langchain>=1.0",
]

[project.urls]
Homepage = "https://github.com/1manideep/ratchet"
Repository = "https://github.com/1manideep/ratchet"
Issues = "https://github.com/1manideep/ratchet/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet_langgraph"]

[tool.uv.sources]
ratchet-core = { workspace = true }
