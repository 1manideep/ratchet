[project]
name = "ratchet-authz-autogen"
version = "0.1.0"
description = "AutoGen intervention-handler adapter for the Ratchet authorization broker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Manideep Pendyala" }]
keywords = ["llm", "agents", "authorization", "capability-tokens", "macaroons", "security", "autogen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "ratchet-authz-core>=0.1,<0.2",
    "autogen-core>=0.4",
]

[project.urls]
Homepage = "https://github.com/1manideep/ratchet"
Repository = "https://github.com/1manideep/ratchet"
Issues = "https://github.com/1manideep/ratchet/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet_autogen"]

[tool.uv.sources]
ratchet-authz-core = { workspace = true }
