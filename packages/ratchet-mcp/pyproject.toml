[project]
name = "ratchet-mcp"
version = "0.1.0"
description = "MCP resource-server adapter for the Ratchet authorization broker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ratchet-core",
]

[project.urls]
Homepage = "https://github.com/1manideep/ratchet"
Repository = "https://github.com/1manideep/ratchet"
Issues = "https://github.com/1manideep/ratchet/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet_mcp"]

[tool.uv.sources]
ratchet-core = { workspace = true }
