[project]
name = "ratchet-authz-core"
version = "0.1.0"
description = "Framework-agnostic authorization broker for multi-agent LLM delegation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Manideep Pendyala" }]
keywords = ["llm", "agents", "authorization", "capability-tokens", "macaroons", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/1manideep/ratchet"
Repository = "https://github.com/1manideep/ratchet"
Issues = "https://github.com/1manideep/ratchet/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet_core"]
