[project]
name = "ratchet-core"
version = "0.1.0"
description = "Framework-agnostic authorization broker for multi-agent LLM delegation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/1manideep/ratchet"
Repository = "https://github.com/1manideep/ratchet"
Issues = "https://github.com/1manideep/ratchet/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet_core"]
