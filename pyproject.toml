[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ratchet-authz-core = { workspace = true }
ratchet-authz-langgraph = { workspace = true }
ratchet-authz-crewai = { workspace = true }
ratchet-authz-autogen = { workspace = true }
ratchet-authz-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is enforced by formatting review, not a hard CI gate
]

[tool.ruff.lint.isort]
known-first-party = [
    "ratchet_core",
    "ratchet_langgraph",
    "ratchet_crewai",
    "ratchet_autogen",
    "ratchet_mcp",
]

[tool.mypy]
python_version = "3.11"
# Scoped to ratchet-core only: the framework adapters depend on third-party
# SDKs (langchain, crewai, autogen-core) whose type stubs are outside this
# project's control, so type-checking them isn't a meaningful CI gate yet.
packages = ["ratchet_core"]
mypy_path = "packages/ratchet-core/src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

