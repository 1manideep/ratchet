name: Release

# Publishing a GitHub release (tag vX.Y.Z, on main) builds the five ratchet-authz-* packages and uploads them
# to PyPI through Trusted Publishing: no token anywhere. Each PyPI project needs a publisher (a pending one
# before its first upload) with owner 1manideep, repository ratchet, workflow release.yml, environment pypi.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: The tag matches every package's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/pyproject.toml; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$p")
            if [ "$v" != "$tag" ]; then echo "$p is version $v, but the tag is $GITHUB_REF_NAME"; exit 1; fi
          done
      - name: The core's tests pass before anything is published
        run: |
          uv sync --group dev
          uv run --package ratchet-authz-core pytest packages/ratchet-core/tests/ -q
      - name: Build every package
        run: uv build --all-packages --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ratchet-authz-core/
    permissions:
      id-token: write # Trusted Publishing: PyPI checks this workflow's identity instead of a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
